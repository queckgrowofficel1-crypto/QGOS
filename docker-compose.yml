version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: qgos_postgres
    environment:
      POSTGRES_USER: qgos
      POSTGRES_PASSWORD: qgos
      POSTGRES_DB: qgos_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qgos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qgos_network

  redis:
    image: redis:7-alpine
    container_name: qgos_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qgos_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qgos_app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://qgos:qgos@postgres:5432/qgos_dev
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: qgos
      DATABASE_PASSWORD: qgos
      DATABASE_NAME: qgos_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-secret-change-in-production
      ADMIN_INITIAL_PASSWORD: dev-admin-password-change-me
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    networks:
      - qgos_network
    command: npm run start:dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  qgos_network:
    driver: bridge
