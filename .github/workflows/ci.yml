name: QGOS CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qgos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qgos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qgos_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Normalize legacy Prisma relations
        run: node scripts/normalize-prisma-relations.cjs

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint:check

      - name: Build API
        run: npm run build

      - name: Unit tests
        run: npm test -- --runInBand --passWithNoTests

      - name: Build production Docker image
        run: docker build -t qgos:ci .

      - name: Production health smoke test
        env:
          NODE_ENV: production
          CORS_ORIGIN: http://localhost:3000
          ENABLE_SWAGGER: 'false'
          JWT_SECRET: ci-only-not-a-production-secret
          PORT: '3000'
          HOST: 127.0.0.1
        run: |
          node dist/main.js > /tmp/qgos.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error --dump-header /tmp/qgos.headers http://127.0.0.1:3000/health > /tmp/qgos.health; then
              echo "QGOS health response:"
              cat /tmp/qgos.health
              echo "QGOS response headers:"
              cat /tmp/qgos.headers
              grep -qi '^x-request-id:' /tmp/qgos.headers || {
                echo "X-Request-Id response header missing"
                exit 1
              }
              echo "QGOS health and request correlation checks passed"
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "QGOS process exited before health check passed"
              cat /tmp/qgos.log
              exit 1
            fi
            sleep 1
          done

          echo "QGOS health check timed out"
          cat /tmp/qgos.log
          exit 1
